      <div class="im-dock-tabs" id="imCropDockTabs"></div>

    <!-- crop & confirm: every upload / suggestion / re-crop passes through here before anything is converted or sent.
         The options bar follows Photoshop's crop tool: ratio presets, W ⇄ H ratio, Clear, size, overlay, reset / cancel / commit. -->
    <dialog class="im-crop" id="imCrop" aria-labelledby="imCropTitle">
      <div class="im-crop-head">
        <span class="im-crop-badge" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <h2 id="imCropTitle">Crop &amp; confirm</h2>
        <span class="im-crop-count" id="imCropCount"></span>
        <span class="im-crop-miniout" id="imCropMiniOut"></span>
        <div class="im-crop-headbtns">
          <button class="im-icon" type="button" id="imCropMin" aria-label="Minimise" title="Minimise: keep this crop and look at the page"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="im-icon" type="button" id="imCropClose" aria-label="Cancel" title="Cancel"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="im-crop-bar" role="toolbar" aria-label="Crop options">
        <span class="im-crop-tool" title="Crop tool"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <i class="im-crop-sep" aria-hidden="true"></i>
        <span class="im-crop-ratioico" id="imCropRatioIco" title="Current ratio" aria-hidden="true"><i></i></span>
        <select class="im-crop-select im-crop-ratio" id="imCropRatio" aria-label="Ratio preset" title="Ratio preset"></select>
        <input class="im-crop-num" id="imCropW" inputmode="decimal" autocomplete="off" aria-label="Ratio width" title="Ratio width: type your own" />
        <button class="im-crop-btn" type="button" id="imCropSwap" title="Swap width and height (X)" aria-label="Swap width and height"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <input class="im-crop-num" id="imCropH" inputmode="decimal" autocomplete="off" aria-label="Ratio height" title="Ratio height: type your own" />
        <button class="im-crop-btn is-text" type="button" id="imCropClear" title="Clear the ratio (free crop)">Clear</button>
        <i class="im-crop-sep" aria-hidden="true"></i>
        <label class="im-crop-field" title="Unity max size: the longest side of the PNG"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 15l5-5l4 4l3-3l4 4M15 8.5h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Size</span><select class="im-crop-select" id="imCropRes"></select></label>
        <i class="im-crop-sep" aria-hidden="true"></i>
        <label class="im-crop-field" title="Crop overlay (O)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><select class="im-crop-select" id="imCropOverlay" aria-label="Crop overlay"></select></label>
        <label class="im-crop-check" id="imCropPadRow"><input type="checkbox" id="imCropPad" /><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3zM8 9h8v6H8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Fit (pad)</label>
        <span class="im-crop-spacer"></span>
        <button class="im-crop-btn" type="button" id="imCropReset" title="Reset crop (R)" aria-label="Reset crop"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="im-crop-btn is-cancel" type="button" id="imCropAbort" title="Cancel (Esc)" aria-label="Cancel"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18zM5.6 5.6l12.8 12.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="im-crop-btn is-commit" type="button" id="imCropCommit" title="Commit (Enter)" aria-label="Commit"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="im-crop-body">

          <img id="imCropImg" alt="" draggable="false" />
          <div class="im-crop-box hidden" id="imCropBox">
            <i class="im-crop-grid ov-thirds" id="imCropGrid" aria-hidden="true"></i>
            <span class="im-crop-tag" id="imCropSizeTag"></span>
            <b data-h="nw"></b><b data-h="ne"></b><b data-h="sw"></b><b data-h="se"></b>
            <b data-h="n" class="is-edge"></b><b data-h="s" class="is-edge"></b><b data-h="w" class="is-edge"></b><b data-h="e" class="is-edge"></b>
          </div>
          <p class="im-crop-error hidden" id="imCropError" role="alert"></p>
        </div>
        <aside class="im-crop-side">
          <div class="im-crop-file">
            <strong id="imCropName"></strong>
            <span id="imCropSrc"></span>
          </div>
          <div class="im-crop-result">
            <span class="option-label">You'll get</span>
            <div class="im-crop-preview im-checker"><canvas id="imCropPreview" width="1" height="1" aria-label="Preview of the PNG"></canvas></div>
            <div class="im-crop-result-text">
              <strong><span id="imCropOut"></span> <em>PNG</em></strong>
              <span class="im-crop-chip" id="imCropOutShape"></span>
            </div>
            <span class="im-crop-dest" id="imCropOutSub"></span>
          </div>
          <p class="im-crop-warn hidden" id="imCropWarn"></p>
          <ul class="im-crop-keys" aria-label="Keyboard shortcuts">
            <li><kbd>Enter</kbd> commit</li><li><kbd>Esc</kbd> cancel</li><li><kbd>X</kbd> swap ratio</li>
            <li><kbd>O</kbd> overlay</li><li><kbd>R</kbd> reset</li><li><kbd>←↑→↓</kbd> nudge</li>
          </ul>
          <label class="im-crop-check hidden" id="imCropAllRow"><input type="checkbox" id="imCropAll" /> Use this ratio and size for the other <span id="imCropAllN"></span> (centred)</label>
          <div class="im-crop-actions">
            <button class="btn btn-sm btn-outline" type="button" id="imCropCancel">Cancel</button>
            <button class="btn btn-sm btn-outline" type="button" id="imCropSkip">Skip</button>
            <button class="btn btn-sm btn-primary" type="button" id="imCropOk">Confirm</button>
          </div>
        </aside>
      </div>
    </dialog>

  </body>
</html>
